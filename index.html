{t:"TEXT 1: Narrative / Fable (No. 1–5)",h:"The Peacock and the Crane",b:"<p>A proud peacock with brilliant, shimmering feathers stood beside a calm lake, preening his magnificent tail. As he admiringly admired his own reflection in the water, a crane landed nearby to search for fish. The crane had simple, plain grey feathers and long, slender legs.</p><p>The peacock looked down his beak at the crane with a contemptuous smile. “Look at your drab and boring plumage, my friend!” sneered the peacock, spreading his tail into a dazzling fan of blues, greens, and gold. “I am dressed like royalty in jewels of bright silk. You, on the other hand, wear nothing but dull grey rags. How tragic it must be to live such a plain existence!”</p><p>The crane calmly finished swallowing a small fish, folded her long wings, and looked back at the peacock with a peaceful expression.</p><p>“Your feathers are indeed breathtaking and glitter like fine jewels,” replied the crane softly. “However, with all your magnificent splendor, you can barely hop onto a low branch or fly across this small fence. My feathers may be simple and muted, but they carry me high above the clouds. I can fly across vast oceans, crest majestic mountains, and view the world from the sky, while you are confined to walking in the dust below.” With a gentle flap of her wings, the crane rose smoothly into the blue sky, leaving the peacock standing alone in silence with his useless beauty.</p>"},
{t:"TEXT 2: Infographic Text (No. 6–10)",h:"Essential Mental Health Strategies for High School Students",b:"<p><b>Prioritize Quality Sleep:</b> Aim for 8–9 hours of sleep daily. Avoid screens 1 hour before bed, as blue light disrupts melatonin production and sleep patterns.</p><p><b>Practice Daily Mindfulness:</b> Spend 5–10 minutes performing deep breathing exercises or guided meditation to calm your nervous system.</p><p><b>Set Realistic Academic Goals:</b> Break large study tasks into smaller, manageable chunks (using the Pomodoro technique) to prevent feeling overwhelmed.</p><p><b>Physical Exercise:</b> Engage in at least 30 minutes of moderate physical activity (like walking, cycling, or sports) to release mood-boosting endorphins.</p><p><b>Nourish Your Body:</b> Eat balanced meals containing healthy fats, proteins, and fresh fruits to maintain steady energy levels and brain health.</p><p><b>Limit Social Media Comparison:</b> Limit time spent on social media apps that trigger unhealthy social comparisons and self-doubt.</p><p><b>Maintain Social Connections:</b> Spend quality offline time with family and supportive friends who uplift you and listen without judgment.</p><p><b>Learn to Say “No”:</b> Avoid overcommitting to too many extracurricular activities when your academic and personal schedules are already full.</p><p><b>Journal Your Feelings:</b> Write down your daily thoughts and gratitude items to process complex emotions and reframe negative mindsets.</p><p><b>Seek Professional Support:</b> Reach out to school counselors, trusted mentors, or mental health professionals if stress becomes persistent or unmanageable.</p>"},
{t:"TEXT 3: Narrative Text (No. 11–15)",h:"The Sound of Harmony",b:"<p>In the mountain village of Cantata, music was the heart of community life. Every year during the Autumn Harvest, the village held a grand musical concert where musicians performed together. However, a bitter rivalry developed between two talented young musicians: Lina, a master of the traditional bamboo flute (<i>suling</i>), and Marcus, a skilled violinist who had studied classical music in the city.</p><p>Lina believed that traditional village instruments possessed a pure, soul-filling sound that should never be altered by modern influence. Marcus, on the other hand, argued that classical violin techniques and complex Western harmonies were far superior to simple folk tunes. Their argument grew so heated that they refused to play in the same ensemble, causing tension among the villagers.</p><p>On the eve of the festival, the old village conductor fell ill and could not lead the orchestra. Unwilling to cancel the performance, the village council asked Lina and Marcus to co-lead the opening piece. Reluctantly, both agreed to meet at the village hall for a single rehearsal.</p><p>At first, both played their own melodies loudly, attempting to drown out the other. The resulting noise was harsh and chaotic. Pausing to catch her breath, Lina noticed how the warm, woody tone of her flute naturally filled the lower mid-range frequencies where Marcus’s sharp violin notes felt thin. Marcus also realized that Lina’s fluid, organic ornaments added warmth to his rigid classical chords.</p><p>“What if we don’t fight for the lead?” Marcus suggested quietly. “What if my violin provides the harmonic foundation while your flute carries the soaring melody?”</p><p>Lina nodded and adjusted her rhythm. As they played together with mutual respect, a breathtaking melody filled the hall—a seamless fusion of traditional folk soul and classical elegance. At the concert the next evening, the audience gave them a standing ovation, celebrating not just their music, but their newfound unity.</p>"},
{t:"TEXT 4: Informational Text (No. 16–20)",h:"Understanding Coral Reef Bleaching",b:"<p>Coral reefs are often called the “rainforests of the sea” because they support nearly 25% of all marine life despite covering less than 0.1% of the ocean floor. These vibrant underwater ecosystems are built by tiny marine organisms called coral polyps, which live in a mutually beneficial symbiotic relationship with microscopic algae known as zooxanthellae. The algae reside inside the coral tissues, providing corals with essential nutrients through photosynthesis and giving them their brilliant colors.</p><p>However, coral reefs are extremely sensitive to environmental temperature changes. When ocean temperatures rise even 1 to 2 degrees Celsius above normal summer averages for prolonged periods—primarily due to global climate change—coral polyps become stressed. In response to heat stress, corals expel their resident zooxanthellae algae.</p><p>Without the algae, the coral loses its primary food source and its vibrant color, revealing its stark white calcium carbonate skeleton. This phenomenon is known as <b>coral bleaching</b>. While bleached corals are not immediately dead, they are severely weakened, starved, and highly vulnerable to disease. If elevated water temperatures persist, the corals eventually starve to death and collapse.</p><p>The loss of coral reefs has devastating domino effects. Thousands of fish species lose their breeding grounds and shelters, threatening coastal fisheries and food security for millions of people. Additionally, healthy coral reefs serve as natural coastal barriers that absorb up to 97% of wave energy, protecting shorelines from tropical storms and erosion. Conserving reefs requires global action to reduce greenhouse gas emissions and local efforts to prevent coastal pollution and overfishing.</p>"},
{t:"TEXT 5: Informational Text with Table (No. 21–25)",h:"The Growing Impact of E-Waste (Electronic Waste)",b:"<p>The rapid pace of technological innovation and shorter device lifespans have fueled a massive increase in global Electronic Waste (e-waste). E-waste encompasses discarded electronic devices, including smartphones, laptops, televisions, and household appliances. When e-waste is improperly disposed of in regular trash or open dumps, toxic heavy metals such as lead, mercury, and cadmium can leach into soil and groundwater, posing severe health risks to nearby communities.</p><p>Conversely, e-waste contains valuable precious metals, including gold, silver, copper, and rare earth elements. Recycling e-waste through formal channels allows these materials to be recovered and reused, reducing the environmental destruction caused by traditional mining.</p><p>Unfortunately, public awareness regarding formal e-waste recycling remains low. Many consumers hoard old electronics in homes or throw them into municipal garbage bins due to a lack of accessible collection centers or data privacy concerns.</p><p><b>Table 1: Urban Electronic Waste Management &amp; Recycling Survey</b></p><div class='wrap'><table><tr><th>E-Waste Category</th><th>Average Lifespan Before Disposal</th><th>Primary Disposal / Storage Method</th><th>Environmental / Health Risk Factor</th><th>Recovery Potential</th></tr><tr><td>Smart Phones &amp; Tablets</td><td>2.5 Years</td><td>62% Hoarded at home / 25% Trash</td><td>High (Lithium batteries, heavy metals)</td><td>Very High (Gold, Copper, Cobalt)</td></tr><tr><td>Laptops &amp; Computers</td><td>4.0 Years</td><td>48% Stored / 35% Sold informal</td><td>High (Lead in circuit boards, plastics)</td><td>High (Precious metals, Aluminum)</td></tr><tr><td>Small Appliances (Kettles, Toasters)</td><td>3.0 Years</td><td>78% Municipal trash bins</td><td>Moderate (Plastics, copper wiring)</td><td>Moderate (Steel, Copper)</td></tr><tr><td>Large Appliances (Fridges, TV)</td><td>7.0 Years</td><td>55% Informal scrap buyers</td><td>High (Refrigerant gases, heavy metals)</td><td>High (Steel, Iron, Copper)</td></tr></table></div>"},
{t:"TEXT 6: Real-Life Narrative / Problem Solving (No. 26–30)",h:"The Green Roof Initiative of Kampong Asri",b:"<p>Kampong Asri was a densely populated urban settlement in a bustling city. Surrounded by concrete buildings, asphalt roads, and metal roofs, the neighborhood suffered from the “urban heat island” effect. During daytime, temperatures inside homes reached suffocating levels, forcing residents to rely heavily on electric fans that spiked electricity bills. Furthermore, heavy rains often caused urban flooding because there were no green areas to absorb rainwater.</p><p>Twenty-one-year-old Anita, a recent urban farming graduate, proposed a solution to the village head: converting bare, flat rooftops into “green roofs” planted with vegetables, hardy herbs, and native grasses. Many older residents were skeptical, fearing that plant soil would leak water through roofs or cause structural damage.</p><p>To prove her idea, Anita transformed her own family’s concrete roof into a demonstration garden using lightweight coconut coir soil, waterproof membrane liners, and recycled plastic trays. Within three weeks, the layer of plants acted as natural insulation. Temperatures inside Anita’s top-floor rooms dropped by nearly 4 degrees Celsius, noticeably reducing their electricity usage.</p><p>Impressed by the tangible results, neighboring families volunteered to join the initiative. Anita conducted workshops on lightweight planting methods and rainwater harvesting. Within six months, over forty rooftops in Kampong Asri were covered in lush green gardens.</p><p>The green roofs not only cooled the neighborhood homes and absorbed excess storm runoff, but they also provided families with fresh, organic vegetables, reducing household food expenses. Kampong Asri became a model urban eco-village, proving that smart green solutions can thrive even in concrete jungles.</p>"}

S(3,"Which fact from the text would be most compelling to present to coastal city planners to justify spending budget on coral reef conservation?",["Zooxanthellae algae give corals their bright red, green, and purple colors.","Healthy coral reefs absorb up to 97% of wave energy, serving as natural barriers against storm damage and coastal erosion.","Coral polyps build skeletons out of calcium carbonate compounds.","Deep ocean waters are generally much colder than surface coastal waters.","Tropical fish like to hide inside small crevices in shallow waters."],1,"Perencana kota peduli perlindungan pantai dari badai dan erosi, sehingga fakta 97% energi gelombang paling meyakinkan."),
M(3,"Which statements from the text support the claim that coral bleaching harms both marine ecosystems and human communities?",["“Thousands of fish species lose their breeding grounds and shelters, threatening coastal fisheries...”","“Healthy coral reefs serve as natural coastal barriers that absorb up to 97% of wave energy...”","“The algae reside inside the coral tissues, providing corals with essential nutrients...”","“Covering less than 0.1% of the ocean floor...”","“...threatening coastal fisheries and food security for millions of people.”"],[0,1,4],"A, B, dan E menunjukkan dampak pada ekosistem laut sekaligus manusia (perikanan, pangan, perlindungan pantai)."),
C(4,"Based on the text and table, categorize each disposal behavior as a Sustainable E-Waste Practice or an Unsustainable E-Waste Practice.",SU,["Handing over old laptops to certified e-waste recycling centers","Throwing broken small appliances directly into regular municipal trash bins","Hoarding unused smartphones at home indefinitely due to lack of recycling awareness"],[0,1,1],"Daur ulang resmi = berkelanjutan. Membuang ke tempat sampah biasa dan menimbun tanpa daur ulang = tidak berkelanjutan."),
M(4,"According to the text and table, why is informal or improper e-waste disposal dangerous to the environment?",["Toxic heavy metals like lead and mercury can leak into soil and underground water supplies.","Old electronics naturally absorb carbon dioxide and cool the atmosphere down.","Lithium batteries and circuit boards present chemical pollution risks when thrown in trash.","E-waste contains no valuable materials that can ever be recovered or reused.","Unregulated disposal can release hazardous refrigerant gases from large appliances."],[0,2,4],"Logam berat meresap ke tanah/air, baterai dan papan sirkuit mencemari, dan gas pendingin berbahaya. B dan D salah."),
M(4,"Who is the primary intended audience for this informational article and survey report?",["Electronics consumers who need awareness about safe disposal and recycling.","Mining companies looking to stop all metal recycling worldwide.","Environmental policymakers and city planners working on waste management systems.","Antique furniture collectors looking for wooden tables.","High school students studying environmental science and urban pollution."],[0,2,4],"Sasaran teks: konsumen, pembuat kebijakan/perencana kota, dan pelajar lingkungan."),
S(4,"Which additional data column in Table 1 would provide the most useful insight for improving e-waste collection rates in cities?",["Percentage of users who download gaming apps on smartphones.","Distance to the nearest official e-waste recycling collection drop-off point.","Color options available for modern refrigerator models.","History of when the first electronic computer was built in the 1940s.","Average screen size comparison between laptops and televisions."],1,"Teks menyebut kurangnya pusat pengumpulan yang mudah dijangkau, sehingga data jarak ke titik pengumpulan paling berguna."),
M(4,"Which of the following statements are supported by direct facts or figures in Table 1?",["Smartphones have an average lifespan of 2.5 years before disposal or storage.","78% of small appliances end up in municipal trash bins.","100% of laptops are recycled through official government facilities.","Large appliances have the longest average lifespan (7.0 years) among listed items.","No precious metals like gold or copper can be recovered from discarded smartphones."],[0,1,3],"A, B, D sesuai angka di Tabel 1. C dan E bertentangan dengan tabel."),
S(5,"Which option best summarizes the story?",["Beginning: Kampong Asri suffered from urban heat and flood runoff due to excessive concrete surfaces.\nProblem: High indoor temperatures increased electricity bills, and residents were skeptical of green roofs.\nSolution: Anita built a successful demonstration green roof, leading 40 families to adopt rooftop gardens that reduced heat, absorbed rain, and grew food.\nLesson: Hands-on demonstration and community education can overcome skepticism and transform urban environments.","Beginning: Anita wanted to start a commercial vegetable store in the city center.\nProblem: She did not have enough capital to rent a shop in the market.\nSolution: The village head gave her a loan to buy a farm outside the city.\nLesson: Financial loans are necessary for young entrepreneurs to succeed.","Beginning: Heavy rains destroyed all concrete roofs in Kampong Asri.\nProblem: The villagers had no money to repair their houses.\nSolution: Anita persuaded the city government to rebuild all houses with metal sheets.\nLesson: Metal roofs are the strongest protection against tropical storms.","Beginning: Kampong Asri was famous for its large parks and forest areas.\nProblem: High electricity bills forced villagers to cut down all trees for firewood.\nSolution: Anita installed solar panels on all rooftops.\nLesson: Solar energy is better than planting trees in urban areas.","Beginning: Anita failed her urban farming university exams due to poor attendance.\nProblem: She had to move back to Kampong Asri to work as an electrician.\nSolution: She repaired broken fans for free across the village.\nLesson: Hard work in manual labor brings personal satisfaction."],0,"Hanya opsi A yang setia pada isi teks: masalah panas dan banjir, demonstrasi Anita, dan adopsi puluhan atap hijau."),
M(5,"Which of the following statements best express the deeper moral lessons of the story?",["Demonstrating successful results firsthand is often more effective at convincing doubters than mere arguments.","Urban environmental problems cannot be solved without tearing down all existing concrete buildings.","Community-based sustainable solutions can yield multiple benefits (cooling, food security, flood reduction).","Skepticism from elders should always stop young people from trying new ideas.","Innovation combined with accessible education empowers communities to improve their living conditions."],[0,2,4],"Pelajaran: bukti nyata meyakinkan, solusi komunitas memberi banyak manfaat, dan inovasi plus edukasi memberdayakan warga."),

M(5,"What would most likely have happened if Anita had only presented verbal speeches without building her demonstration rooftop garden?",["Many skeptical residents might have hesitated or refused to try rooftop farming.","The urban heat island effect in Kampong Asri would have been solved overnight anyway.","The villagers might have continued suffering from suffocating indoor heat and high electricity bills.","The city government would have banned all plants from concrete buildings.","Anita would have had a harder time proving that plant soil would not leak through concrete roofs."],[0,2,4],"Tanpa bukti nyata, warga tetap ragu, masalah panas berlanjut, dan Anita sulit membuktikan atap tidak bocor."),
M(5,"Which sentences from the text strongly support the claim that Anita’s green roof project provided direct economic and physical benefits to the residents?",["“Temperatures inside Anita’s top-floor rooms dropped by nearly 4 degrees Celsius, noticeably reducing their electricity usage.”","“Anita proposed a solution to the village head...”","“Many older residents were skeptical...”","“...they also provided families with fresh, organic vegetables, reducing household food expenses.”","“Kampong Asri was a densely populated urban settlement in a bustling city.”"],[0,3],"Manfaat langsung: suhu turun dan listrik hemat (A), serta sayuran segar yang mengurangi biaya makan (D).")
